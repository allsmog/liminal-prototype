<!--
  Cut 13 · Judgment · one AI result, one accountable human, one record (LIM-2273)
  ──────────────────────────────────────────────────────────────────────
  Loop-stage · Decide → Record        (the seam between them · hands to Re-enter)
  Altitude   · L1→L2
  Surface    · desktop
  Framing    · wedge→infra            (spend is the subject · the judgment layer is the product)
  Maturity   · refining               (prototype · deterministic fixture · device-local record · demonstration-key signature)
  Spec ref   · Linear LIM-2273 (parent LIM-2168) · consumes LIM-2269/2270/2271 as far as they are ruled;
               design decisions those tickets have not yet closed are listed in the PR, not decided here.
  ──────────────────────────────────────────────────────────────────────
  Convergence check (TAXONOMY rule 5): cut 11 is full-loop at L1→L2; cut 01 is
  Capture→Read→Decide at L1; cut 10 is Re-enter. Nothing else owns the Decide→Record
  seam as one continuous act, so this is not a duplicate projection. It REUSES rather
  than re-renders: the AI result is cut 11's spend case gc-2026-06-A (finding F-CAL),
  rendered with the shared .p-read primitive; the record goes through lib/vault-store.js
  (the same IndexedDB cut 11 writes); re-entry is cut 10, not a new Today.

  What a viewer can do here without narration:
    1. read one AI result that is explicitly NOT yet human-accepted
    2. open the evidence under it (each piece says what it bears on)
    3. pick the assertion they dispute and write the correction (original stays)
    4. accept / correct / reject / defer · confirm · the record is written
    5. read the six-question record · continue to Today · reopen it from there

  Claim register · everything on this surface is a deterministic fixture except the
  operator's own judgment, which is genuinely stored in this browser's IndexedDB.
  The content hash is SHA-256 computed here; it is not a signature and says so.
  On record, lib/judgment-proof.js signs a packet.v2 finding with an Ed25519
  DEMONSTRATION key made in this browser; the bundle ships the unchanged offline
  verifier from receipts/2026-10-06/bundle/. The key identifies no person or
  organization, and the record says which fields the signature does not cover.
  Nothing is propagated, no rule is activated, no external system changes.

  Runtime · lib/judgment.js (state, record, persistence) · lib/judgment.css (layer)
  · lib/vault-store.js · lib/correction-tags.js · lib/surface-nav.js · lib/demo-restart.js
  Deep link · ?record=<vault id> reopens a stored record read-only (Today links here).
-->

<script type="module">
import {
  FIXTURE, STATES, DISPOSITION_LABELS, DEFER_WINDOWS, OPERATOR,
  CORRECTION_TAGS, CORRECTION_TAG_LABELS, CORRECTION_TAG_DESCRIPTIONS,
  assertionById, evidenceById, validateJudgment, buildRecord,
  sha256Hex, shortHash, vaultAvailable, recordJudgment, loadJudgment, correctionPattern,
  fmtTime, fmtAgo, fmtDue,
} from "../lib/judgment.js";
import { proveRecord, bundleFiles, bundleName, zipFiles, VERIFIER_FILES, KEY_LABEL } from "../lib/judgment-proof.js";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const main = $("#jd");

/* ─── scene state · one object, re-rendered on phase changes only ───── */
const S = {
  view: "judge",            // judge · record · notfound
  phase: "choose",          // choose · form · confirm   (judge view)
  state: STATES.PROPOSED,   // lifecycle of the AI result
  disposition: null,
  assertionId: null,
  correctedText: "",
  tag: null,
  rationale: "",
  deferWindow: null,
  inspected: new Set(),     // evidence ids the operator opened
  open: new Set(),          // evidence ids currently expanded
  problems: [],
  record: null,
  recordId: null,
  recordTs: null,
  failure: null,
  pattern: null,
  originalHash: null,
  proof: null,              // signed packet for the confirmed record · kept across a vault retry
  reopened: false,
  focus: null,
};

/* ─── helpers ───────────────────────────────────────────────────────── */
function toast(msg) {
  const t = $("#toast");
  t.innerHTML = `<span class="t-glyph">◇</span>${msg}`;
  t.classList.add("is-shown");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("is-shown"), 2800);
}
const supportLabel = { supported: "supported", thin: "thin evidence", derived: "derived", "agent-corrected": "agent-corrected" };

function stateStrip(stateFor, record) {
  const order = [STATES.PROPOSED, STATES.CONFIRMED, STATES.RECORDED];
  const cur = order.indexOf(stateFor);
  const failed = S.failure && stateFor === STATES.CONFIRMED;
  const cells = [
    { k: "proposed", v: `AI produced it · ${fmtTime(FIXTURE.producer.producedAt)} · ${record ? "awaited judgment" : "not yet human-accepted"}` },
    { k: "operator-confirmed", v: record?.confirmedAt ? `${DISPOSITION_LABELS[record.disposition]} · ${fmtTime(record.confirmedAt)}` : "nobody has judged this yet" },
    { k: "recorded", v: record?.recordedAt ? `device-local vault · id #${S.recordId} · ${fmtTime(record.recordedAt)}` : (failed ? "not recorded · the vault could not be written" : stateFor === STATES.CONFIRMED && !S.failure ? "writing to this device's vault…" : "nothing stored") },
  ];
  return `<ol class="jd-states" aria-label="Lifecycle of this result" data-state="${esc(stateFor)}">${cells.map((c, i) => {
    const cls = i < cur ? "is-done" : i === cur ? "is-current" : "";
    const fail = failed && i === 2 ? " is-failed" : "";
    return `<li class="jd-state ${cls}${fail}"><span class="jd-state__k">${c.k}</span><span class="jd-state__v">${esc(c.v)}</span></li>`;
  }).join("")}</ol>`;
}

/* ─── the AI result card · shared .p-read primitive + assertion list ─ */
function resultCard({ interactive, change = null, markChanged = false, badge = "AI-produced · not yet human-accepted" }) {
  const rows = FIXTURE.assertions.map(a => {
    const pressed = S.assertionId === a.id;
    const corr = change && change.assertionId === a.id;
    const cites = a.evidence.map(id => `<span class="cite">${esc(evidenceById(id)?.title.split(" · ")[0] || id)}</span>`).join("");
    const tag = interactive ? "button" : "div";
    const attrs = interactive
      ? `type="button" aria-pressed="${pressed}" data-assert="${a.id}" aria-describedby="jd-assert-help"`
      : `data-assert="${a.id}"`;
    return `<li><${tag} class="jd-assert" ${attrs}>
      <span class="jd-assert__id">${a.id}</span>
      <span>
        <span class="jd-assert__t">${esc(a.text)}</span>
        <span class="jd-assert__note">${cites}${esc(a.supportNote)}${corr && markChanged ? ` · <b>corrected in §4 · the text above is the AI's, unchanged</b>` : ""}</span>
      </span>
      <span class="jd-support jd-support--${a.support}">${supportLabel[a.support] || a.support}</span>
    </${tag}></li>`;
  }).join("");
  const agent = FIXTURE.assertions.filter(a => a.agentAction).map(a =>
    `<div class="jd-agent-line"><span class="who">⊘ agent · ${esc(a.agentAction.actor)}</span><span>${esc(a.agentAction.what)} · ${fmtTime(a.agentAction.at)} · this happened before the result reached you and was not your action.</span></div>`).join("");
  return `<div class="p-read p-read--judgment jd-result" id="jd-result">
    <div class="p-read__head">${esc(FIXTURE.producer.name)} · ${esc(FIXTURE.producer.detail)}<span class="jd-ai-badge ${interactive ? "" : "is-ink"}" title="${interactive ? "Produced by an agent. Nothing here has been accepted by a person." : "Produced by an agent. Preserved exactly as produced; the judgment on it is recorded separately."}">${esc(badge)}</span></div>
    <div class="p-read__tags"><span class="p-read__tag">${esc(FIXTURE.subject)}</span><span class="p-read__tag">${esc(FIXTURE.caseId)} · ${esc(FIXTURE.findingId)}</span><span class="p-read__tag">lane · ${esc(FIXTURE.lane)}</span></div>
    <p class="jd-headline">${esc(FIXTURE.headline)}</p>
    ${interactive ? `<p class="jd-hint" id="jd-assert-help" style="margin:0 0 8px">Five assertions. Each names the evidence under it. Select one to dispute it.</p>` : ""}
    <ol class="jd-assertions">${rows}</ol>
    ${agent}
    <div class="jd-uncertain"><div class="jd-uncertain__k">what the agent itself left uncertain</div><ul>${FIXTURE.uncertainty.map(u => `<li>${esc(u)}</li>`).join("")}</ul></div>
    <div class="p-read__receipt"><span class="p-read__receipt-k">read · ${esc(FIXTURE.caseId)} · ${esc(FIXTURE.findingId)}</span> · produced ${fmtTime(FIXTURE.producer.producedAt)} · recorded fixture run · original ${S.originalHash ? `SHA-256 ${shortHash(S.originalHash)}` : "hash pending"} · unchanged by any judgment</div>
  </div>`;
}

/* ─── evidence dock ─────────────────────────────────────────────────── */
function evidenceDock() {
  return `<div class="jd-evidence" id="jd-evidence">${FIXTURE.evidence.map(e => {
    const open = S.open.has(e.id);
    const seen = S.inspected.has(e.id);
    const body = e.rows
      ? `<table><thead><tr>${e.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${e.rows.map(r => `<tr class="${r[0] === "E14" ? "is-dropped" : ""}">${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>${e.note ? `<div class="jd-ev__note">${esc(e.note)}</div>` : ""}`
      : `<div>${esc(e.body)}</div>`;
    return `<details class="jd-ev ${e.kind === "absent" ? "jd-ev--absent" : ""} ${seen ? "is-inspected" : ""}" data-ev="${e.id}" ${open ? "open" : ""}>
      <summary><span class="jd-ev__glyph">${e.kind === "absent" ? "∅" : "▣"}</span><span><span class="jd-ev__t">${esc(e.title)}</span><span class="jd-ev__src">${esc(e.kind)} · ${esc(e.source)}</span></span><span class="jd-ev__bear">${esc(e.bearing)}<br><span class="jd-ev__seen">${seen ? "opened" : ""}</span></span></summary>
      <div class="jd-ev__body">${body}</div>
    </details>`;
  }).join("")}</div>`;
}
function inspectedMeta() { return `${S.inspected.size} of ${FIXTURE.evidence.length} opened`; }

/* ─── judgment panel · choose → form → confirm ──────────────────────── */
function panelChoose() {
  return `<h3 class="jd-panel__q" id="jd-panel-h" tabindex="-1">Does this deserve to be trusted?</h3>
  <p class="jd-panel__sub">The agent finished. That is not a decision. <em>Yours is.</em> Correcting is the primary act here: it keeps the original and appends what you know.</p>
  <div class="jd-dispos" role="group" aria-label="Disposition">
    <button type="button" class="jd-dispo jd-dispo--primary" data-dispo="correct"><span class="jd-dispo__l">Correct</span><span class="jd-dispo__k">primary</span><span class="jd-dispo__d">Pick the assertion that is wrong, write what is true, keep the AI's text beside yours.</span></button>
    <button type="button" class="jd-dispo" data-dispo="accept"><span class="jd-dispo__l">Accept</span><span class="jd-dispo__k">as is</span><span class="jd-dispo__d">The five assertions stand as your judgment. The record says which evidence you opened first.</span></button>
    <button type="button" class="jd-dispo" data-dispo="reject"><span class="jd-dispo__l">Reject</span><span class="jd-dispo__k">set aside</span><span class="jd-dispo__d">Nothing is routed. The result is kept, marked rejected, with your reason.</span></button>
    <button type="button" class="jd-dispo" data-dispo="defer"><span class="jd-dispo__l">Defer</span><span class="jd-dispo__k">hold</span><span class="jd-dispo__d">Comes back on Today at a date you pick. It stays AI-produced, not accepted, until then.</span></button>
  </div>`;
}

function tagPicker() {
  return `<div class="jd-field"><span class="jd-label" id="jd-tag-label">What kind of miss <span class="opt">optional · the canon correction taxonomy</span></span>
    <div class="jd-tags" role="group" aria-labelledby="jd-tag-label">${CORRECTION_TAGS.map(t => `<button type="button" class="jd-tag" data-tag="${t}" aria-pressed="${S.tag === t}">${esc(CORRECTION_TAG_LABELS[t])}</button>`).join("")}</div>
    <div class="jd-tag-gloss" id="jd-tag-gloss">${S.tag ? esc(CORRECTION_TAG_DESCRIPTIONS[S.tag]) : ""}</div></div>`;
}

function panelForm() {
  const d = S.disposition;
  let body = "";
  if (d === "correct") {
    const a = assertionById(S.assertionId);
    body = `
      <div class="jd-field">
        <span class="jd-label">Disputed assertion</span>
        ${a ? `<div class="jd-orig"><span class="k">${a.id} · as the AI wrote it · stays in the record</span>${esc(a.text)}</div>`
             : `<div class="jd-pick" id="jd-pick">Select an assertion in the result on the left. <b>A2</b> is the one the agent itself marked thin.</div>`}
      </div>
      <div class="jd-field">
        <label for="jd-corrected">Corrected assertion <span class="opt">required · what is actually true</span></label>
        <textarea id="jd-corrected" placeholder="${a ? "Rewrite " + a.id + " as it should read." : "Select an assertion first."}" ${a ? "" : "disabled"}>${esc(S.correctedText)}</textarea>
      </div>
      ${tagPicker()}
      <div class="jd-field">
        <label for="jd-rationale">Why <span class="opt">optional · what you know that the evidence did not show</span></label>
        <textarea id="jd-rationale" class="jd-short" placeholder="e.g. what the run actually was, and how you know.">${esc(S.rationale)}</textarea>
      </div>`;
  } else if (d === "accept") {
    body = `
      ${S.inspected.size === 0 ? `<div class="jd-warn">You have not opened any evidence. You can still accept; the record will say so.</div>` : ""}
      <div class="jd-field">
        <label for="jd-rationale">Note <span class="opt">optional</span></label>
        <textarea id="jd-rationale" class="jd-short" placeholder="Anything a reader of the record should know about why this stands.">${esc(S.rationale)}</textarea>
      </div>
      <div class="jd-pick">Accepting makes all five assertions <b>your</b> judgment, including A2, which the agent marked thin. The AI's text is preserved as the AI's; your acceptance is a separate line in the record.</div>`;
  } else if (d === "reject") {
    body = `
      <div class="jd-field">
        <label for="jd-rationale">Why the result is rejected <span class="opt">required</span></label>
        <textarea id="jd-rationale" placeholder="What makes the whole result unusable, as opposed to one assertion being wrong?">${esc(S.rationale)}</textarea>
      </div>
      <div class="jd-pick">Rejecting routes nothing and changes no agent. The result is kept in the record, marked rejected, so the next review can see what was set aside and why. If only one assertion is wrong, <b>Correct</b> is the finer tool.</div>`;
  } else if (d === "defer") {
    body = `
      <div class="jd-field">
        <span class="jd-label" id="jd-win-label">Bring it back <span class="opt">required</span></span>
        <div class="jd-windows" role="group" aria-labelledby="jd-win-label">${DEFER_WINDOWS.map(w => `<button type="button" class="jd-tag" data-window="${w.id}" aria-pressed="${S.deferWindow === w.id}">${esc(w.label)}</button>`).join("")}</div>
      </div>
      <div class="jd-field">
        <label for="jd-rationale">What you are waiting for <span class="opt">optional</span></label>
        <textarea id="jd-rationale" class="jd-short" placeholder="e.g. ask Bianca what E13 was.">${esc(S.rationale)}</textarea>
      </div>
      <div class="jd-pick">Deferring holds the result as <b>AI-produced, not accepted</b>. Today shows it again on the date you pick. Nothing fires on its own.</div>`;
  }
  return `<h3 class="jd-panel__q" id="jd-panel-h" tabindex="-1">${esc(DISPOSITION_LABELS[d])} · ${d === "correct" ? "say what is true" : d === "accept" ? "take it as your own" : d === "reject" ? "set it aside" : "hold it"}</h3>
  <form class="jd-form" id="jd-form" novalidate>
    ${body}
    <ul class="jd-problems" id="jd-problems" aria-live="assertive">${S.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="jd-actions">
      <button type="submit" class="jd-btn jd-btn--primary" id="jd-review">Review the judgment →</button>
      <button type="button" class="jd-btn" data-back="choose">Back</button>
      <span class="jd-hint"><span class="jd-kbd">esc</span> back · evidence stays open</span>
    </div>
  </form>`;
}

function panelConfirm() {
  const d = S.disposition;
  const a = d === "correct" ? assertionById(S.assertionId) : null;
  const seen = FIXTURE.evidence.filter(e => S.inspected.has(e.id)).map(e => e.title.split(" · ")[0]);
  const win = d === "defer" ? DEFER_WINDOWS.find(w => w.id === S.deferWindow) : null;
  const does = {
    correct: "appends your correction beside the AI's assertion; the original is kept unchanged; nothing is routed or propagated.",
    accept: "records the five assertions as your judgment; the AI's text is kept as the AI's; nothing is routed or propagated.",
    reject: "records the result as set aside with your reason; nothing is routed; no agent changes.",
    defer: `holds the result, still AI-produced and not accepted, and brings it back on Today in ${win ? win.label : "the window you picked"}.`,
  }[d];
  return `<h3 class="jd-panel__q" id="jd-panel-h" tabindex="-1">Confirm the judgment</h3>
  <p class="jd-panel__sub">Confirming moves this from <em>proposed</em> to <em>operator-confirmed</em>, then writes it to this device's vault as <em>recorded</em>.</p>
  <div class="jd-summary">
    <div class="jd-sum"><span class="k">disposition</span><span class="v"><b>${esc(DISPOSITION_LABELS[d])}</b></span></div>
    ${a ? `<div class="jd-sum"><span class="k">disputed</span><span class="v">${a.id} · <b>${esc(a.text)}</b></span></div>
           <div class="jd-sum"><span class="k">corrected to</span><span class="v"><b>${esc(S.correctedText.trim())}</b></span></div>
           <div class="jd-sum"><span class="k">kind</span><span class="v">${S.tag ? esc(CORRECTION_TAG_LABELS[S.tag]) : "untagged"}</span></div>` : ""}
    ${win ? `<div class="jd-sum"><span class="k">returns</span><span class="v">in ${esc(win.label)} · on Today</span></div>` : ""}
    ${S.rationale.trim() ? `<div class="jd-sum"><span class="k">${d === "correct" ? "why" : d === "reject" ? "reason" : "note"}</span><span class="v">${esc(S.rationale.trim())}</span></div>` : ""}
    <div class="jd-sum"><span class="k">evidence opened</span><span class="v">${seen.length ? seen.map(esc).join(" · ") : "<b>none</b>"} · ${S.inspected.size} of ${FIXTURE.evidence.length}</span></div>
    <div class="jd-sum"><span class="k">who</span><span class="v">${esc(OPERATOR.name)} · ${esc(OPERATOR.identity)}</span></div>
    <div class="jd-sum"><span class="k">when</span><span class="v">set at the moment you confirm</span></div>
    <div class="jd-sum"><span class="k">this does</span><span class="v">${esc(does)}</span></div>
    <div class="jd-sum"><span class="k">this does not</span><span class="v">sign anything · anchor anything · change any agent · activate any rule</span></div>
  </div>
  <div class="jd-actions" style="margin-top:12px">
    <button type="button" class="jd-btn jd-btn--primary" id="jd-confirm">Confirm &amp; record</button>
    <button type="button" class="jd-btn" data-back="form">Edit</button>
    <span class="jd-hint"><span class="jd-kbd">esc</span> back to edit</span>
  </div>`;
}

/* ─── judge view ────────────────────────────────────────────────────── */
function renderJudge() {
  const panel = S.phase === "choose" ? panelChoose() : S.phase === "form" ? panelForm() : panelConfirm();
  main.innerHTML = `<div class="jd-wrap jd-enter">
    <div class="jd-eyebrow">Judgment · the AI finished · nobody has accepted it</div>
    <h1 class="jd-title">An agent says: route calendar admin off the frontier model.</h1>
    <p class="jd-lede">The Judgment register read the June spend case and proposed a routing. <b>It is a proposal.</b> Inspect what it leans on, then decide what deserves to be trusted. Whatever you do, the agent's words stay the agent's.</p>
    ${stateStrip(S.state, null)}
    <div class="jd-cols">
      <div class="jd-col">
        <div>
          <div class="jd-section-label"><span>The AI result</span><span class="meta">${esc(FIXTURE.producer.name)} · ${fmtTime(FIXTURE.producer.producedAt)}</span></div>
          ${resultCard({ interactive: true })}
        </div>
        <div>
          <div class="jd-section-label"><span>Evidence under it</span><span class="meta" id="jd-ev-meta">${inspectedMeta()} · open any to inspect</span></div>
          ${evidenceDock()}
        </div>
      </div>
      <div class="jd-col">
        <div class="jd-panel" id="jd-panel" data-phase="${S.phase}" data-disposition="${S.disposition || ""}">${panel}</div>
      </div>
    </div>
    <div class="jd-foot">The read is the model's until you change it. Correct first, then confirm: the record keeps both voices apart, and Today brings it back.</div>
  </div>`;
  wireJudge();
}

function wireJudge() {
  /* assertions · select to dispute (any phase) */
  main.querySelectorAll("[data-assert]").forEach(btn => btn.addEventListener("click", () => {
    const id = btn.dataset.assert;
    S.assertionId = id;
    const a = assertionById(id);
    if (S.disposition !== "correct" || S.phase !== "form") {
      S.disposition = "correct"; S.phase = "form"; S.problems = [];
      S.correctedText = a.text;
      S.focus = "jd-corrected";
      renderJudge();
      return;
    }
    S.correctedText = a.text;
    main.querySelectorAll("[data-assert]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.assert === id)));
    S.focus = "jd-corrected";
    renderJudge();
  }));
  /* evidence · opening = inspecting */
  main.querySelectorAll("details.jd-ev").forEach(d => d.addEventListener("toggle", () => {
    const id = d.dataset.ev;
    if (d.open) { S.open.add(id); S.inspected.add(id); d.classList.add("is-inspected"); d.querySelector(".jd-ev__seen").textContent = "opened"; }
    else S.open.delete(id);
    const m = $("#jd-ev-meta"); if (m) m.textContent = `${inspectedMeta()} · open any to inspect`;
  }));
  /* dispositions */
  main.querySelectorAll("[data-dispo]").forEach(b => b.addEventListener("click", () => {
    S.disposition = b.dataset.dispo; S.phase = "form"; S.problems = [];
    if (S.disposition === "correct" && S.assertionId) S.correctedText = S.correctedText || assertionById(S.assertionId).text;
    S.focus = S.disposition === "correct" ? (S.assertionId ? "jd-corrected" : "jd-panel-h") : S.disposition === "defer" ? "jd-panel-h" : "jd-rationale";
    renderJudge();
  }));
  /* back */
  main.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => { S.phase = b.dataset.back; S.problems = []; S.focus = "jd-panel-h"; renderJudge(); }));
  /* form fields · keep S current without re-rendering */
  const corr = $("#jd-corrected"); if (corr) corr.addEventListener("input", () => { S.correctedText = corr.value; });
  const rat = $("#jd-rationale"); if (rat) rat.addEventListener("input", () => { S.rationale = rat.value; });
  main.querySelectorAll("[data-tag]").forEach(b => b.addEventListener("click", () => {
    S.tag = S.tag === b.dataset.tag ? null : b.dataset.tag;
    main.querySelectorAll("[data-tag]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.tag === S.tag)));
    $("#jd-tag-gloss").textContent = S.tag ? CORRECTION_TAG_DESCRIPTIONS[S.tag] : "";
  }));
  main.querySelectorAll("[data-window]").forEach(b => b.addEventListener("click", () => {
    S.deferWindow = b.dataset.window;
    main.querySelectorAll("[data-window]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.window === S.deferWindow)));
  }));
  /* review → confirm */
  const form = $("#jd-form"); if (form) form.addEventListener("submit", (e) => {
    e.preventDefault();
    S.problems = validateJudgment(currentJudgment());
    if (S.problems.length) { renderJudge(); const p = $("#jd-problems"); if (p) p.focus?.(); return; }
    S.phase = "confirm"; S.focus = "jd-panel-h"; renderJudge();
  });
  const confirm = $("#jd-confirm"); if (confirm) confirm.addEventListener("click", confirmJudgment);
  applyFocus();
}

function currentJudgment() {
  return { disposition: S.disposition, assertionId: S.assertionId, correctedText: S.correctedText, tag: S.tag, rationale: S.rationale, deferWindow: S.deferWindow };
}

function applyFocus() {
  if (!S.focus) return;
  const el = document.getElementById(S.focus);
  S.focus = null;
  if (el) { el.focus({ preventScroll: false }); if (el.tagName === "TEXTAREA") el.setSelectionRange(el.value.length, el.value.length); }
}

/* ─── confirm → operator-confirmed → recorded ───────────────────────── */
async function confirmJudgment() {
  const problems = validateJudgment(currentJudgment());
  if (problems.length) { S.problems = problems; S.phase = "form"; renderJudge(); return; }
  const confirmedAt = Date.now();
  S.record = buildRecord({ judgment: currentJudgment(), inspected: [...S.inspected], actor: OPERATOR, confirmedAt });
  S.proof = null;
  S.state = STATES.CONFIRMED; S.failure = null; S.view = "record"; S.focus = "jd-record-h";
  renderRecord();
  await persist();
}

async function persist() {
  try {
    if (!vaultAvailable()) throw new Error("IndexedDB is not available in this browser context");
    /* sign once per confirmed judgment; a retry after a failed write reuses it */
    if (!S.proof) S.proof = await proveRecord(S.record);
    const { id, record } = await recordJudgment(S.record, { proof: S.proof });
    S.record = record; S.recordId = id; S.recordTs = Date.now(); S.state = STATES.RECORDED; S.failure = null;
    if (record.change) S.pattern = await correctionPattern({ tag: record.change.tag, lane: record.lane });
    history.replaceState(null, "", `?record=${id}`);
    /* the record re-renders once the write lands; keep the reader on its heading */
    S.focus = "jd-record-h";
    renderRecord();
    toast(`Recorded · device-local vault · id #${id} · ${record.proof?.signed ? "signed with this browser's demonstration key" : "unsigned"}`);
  } catch (err) {
    console.warn("[judgment] record failed", err);
    S.failure = String(err?.message || err);
    S.focus = "jd-record-h";
    renderRecord();
  }
}

/* ─── the proof · a bundle the existing offline verifier checks ─────── */
async function downloadProof() {
  const r = S.record, proof = r.proof;
  const verifier = {};
  for (const [name, path] of Object.entries(VERIFIER_FILES)) {
    const res = await fetch(`../${path}`);
    if (!res.ok) throw new Error(`could not load ${name} (${res.status})`);
    verifier[name] = new Uint8Array(await res.arrayBuffer());
  }
  const folder = bundleName(proof);
  const zip = zipFiles(bundleFiles(proof, r, verifier), { folder, at: proof.preparedAt });
  const url = URL.createObjectURL(new Blob([zip], { type: "application/zip" }));
  const a = document.createElement("a");
  a.href = url; a.download = `${folder}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function proofBlock(r) {
  const p = r.proof;
  if (!p) return `<div class="jd-notice jd-notice--quiet jd-proof" id="jd-proof" data-signed="none"><span class="k">no proof</span>This record was stored before signing existed in this prototype, so it carries no packet.</div>`;
  const cmd = p.signed ? `node verify.mjs . --expect-fingerprint ${p.fingerprint}` : "node verify.mjs .";
  return `<div class="jd-notice jd-notice--quiet jd-proof" id="jd-proof" data-signed="${p.signed ? "yes" : "no"}">
    <span class="k">${p.signed ? "proof · check it offline with Node, no Liminal app" : "proof · not signed"}</span>
    ${p.signed
      ? `Packet <code>${esc(p.packet.packet.id)}</code> (${esc(p.packet.schema)}), signed with a <b>${esc(KEY_LABEL)}</b>. Fingerprint <code class="jd-fp">${esc(p.fingerprint)}</code>.`
      : `This browser could not sign (${esc(p.signError)}). The bundle still carries the packet; the verifier reports it <b>UNVERIFIED</b>, which is the honest result.`}
    <p style="margin-top:8px">The signature covers the AI result as produced, your disposition, your words, the corrected text and tag, the confirm time and any defer date. It does <b>not</b> cover which evidence you opened, the actor label, the record time or the vault id: the packet format has no field for them.</p>
    <p style="margin-top:8px">Unzip, then run <code>${esc(cmd)}</code> with Node 18 or newer. The verifier in the bundle is the one published at <code>receipts/2026-10-06/bundle/</code>, unchanged.</p>
    <span class="jd-actions" style="display:inline-flex;margin-top:8px"><button type="button" class="jd-btn" id="jd-proof-dl">Download proof bundle (.zip)</button></span>
  </div>`;
}

/* ─── the record · six questions ────────────────────────────────────── */
function decidedLead(r) {
  const n = r.original.assertions.length;
  switch (r.disposition) {
    case "correct": return `The AI's routing proposal stands <b>as corrected</b>: ${r.change.assertionId} now reads as you wrote it; the other ${n - 1} assertions stand as the agent wrote them.`;
    case "accept": return `The AI's routing proposal stands <b>as your judgment</b>. All ${n} assertions are accepted unchanged.`;
    case "reject": return `The AI's routing proposal is <b>set aside</b>. Nothing is routed. It stays in the record as rejected, with your reason.`;
    case "defer": return `The AI's routing proposal is <b>held</b> for ${esc(r.defer.label)}. It returns on Today, ${esc(fmtDue(r.defer.dueAt))}. Until then it is AI-produced, not accepted.`;
  }
  return "";
}

function renderRecord() {
  const r = S.record;
  const origHash = r.originalHash || S.originalHash;
  const recorded = S.state === STATES.RECORDED;
  const failed = !!S.failure;
  const signed = recorded && !!r.proof?.signed;
  const eyeState = recorded ? `recorded · device-local · ${signed ? "demonstration-key signature" : "unsigned"}` : failed ? "operator-confirmed · NOT recorded" : "operator-confirmed · recording…";
  const changeBlock = r.change ? `
    <div class="jd-diff">
      <div class="jd-diff__side is-orig"><div class="jd-diff__k"><span>original · ${esc(r.original.producer.name)}</span><span>${r.change.assertionId}</span></div><div class="jd-diff__t">${esc(r.change.originalText)}</div><div class="jd-diff__meta">kept verbatim · ${origHash ? "SHA-256 " + shortHash(origHash) : "hash pending"}</div></div>
      <div class="jd-diff__side is-corr"><div class="jd-diff__k"><span>corrected · ${esc(r.actor.name)}</span><span>${r.change.assertionId}</span></div><div class="jd-diff__t">${esc(r.change.correctedText)}</div><div class="jd-diff__meta">${r.change.tag ? esc(CORRECTION_TAG_LABELS[r.change.tag]) + " · " : ""}${fmtTime(r.confirmedAt)}</div></div>
    </div>
    ${r.change.rationale ? `<p style="margin-top:10px"><b>Why.</b> ${esc(r.change.rationale)}</p>` : ""}
    ${r.change.affects.length ? `<p>${r.change.affects.join(", ")} ${r.change.affects.length > 1 ? "were" : "was"} derived from the original ${r.change.assertionId}. ${r.change.affects.length > 1 ? "They are" : "It is"} shown as the agent wrote ${r.change.affects.length > 1 ? "them" : "it"} and <b>not recomputed</b>; the correction narrows what ${r.change.affects.length > 1 ? "they" : "it"} can claim.</p>` : ""}`
    : r.disposition === "accept" ? `<p>Nothing in the text. All five assertions stand as the agent wrote them. Your acceptance is a separate line, below, not an edit of the AI's words.${r.rationale ? ` <b>Note.</b> ${esc(r.rationale)}` : ""}</p>`
    : r.disposition === "reject" ? `<p>Nothing in the text. The whole result is set aside. <b>Reason.</b> ${esc(r.rationale)}</p>`
    : `<p>Nothing yet. The result is held, unchanged, and comes back ${esc(fmtDue(r.defer.dueAt))}.${r.rationale ? ` <b>Waiting for.</b> ${esc(r.rationale)}` : ""}</p>`;

  const pattern = S.pattern ? `<div class="jd-pattern"><span class="k">pattern watch · evidence, not a rule</span>
      <span class="dots">${Array.from({ length: S.pattern.threshold }, (_, i) => i < S.pattern.total ? "<b>●</b>" : "○").join("")}</span>
      ${S.pattern.total} correction${S.pattern.total === 1 ? "" : "s"} tagged <b>${esc(CORRECTION_TAG_LABELS[S.pattern.tag])}</b> on <b>${esc(S.pattern.lane)}</b>: ${S.pattern.prior} earlier in this fixture, ${S.pattern.device} recorded on this device. At ${S.pattern.threshold} Liminal would <b>propose</b> a rule for your review. Nothing is proposed, nothing is active.</div>` : "";

  const seen = r.evidence.filter(e => e.inspected), unseen = r.evidence.filter(e => !e.inspected);

  main.innerHTML = `<div class="jd-wrap jd-enter">
    <div class="jd-eyebrow">${S.reopened ? "Reopened from Today · " : ""}Decision record · ${esc(r.caseId)} · ${esc(r.findingId)}</div>
    <h1 class="jd-title" id="jd-record-h" tabindex="-1">${esc(r.dispositionLabel)}: ${r.disposition === "reject" ? "the routing proposal is set aside." : r.disposition === "defer" ? "the routing proposal is held." : r.disposition === "accept" ? "the routing proposal is now your judgment." : "the routing proposal, with your correction beside the agent's words."}</h1>
    <p class="jd-lede">A record a newcomer can read without knowing how Liminal works: six questions, in the order they matter.</p>
    ${stateStrip(S.state, r)}
    ${failed ? `<div class="jd-notice" style="margin-bottom:1.2rem"><span class="k">confirmed, not recorded</span>Your judgment is confirmed on this page but could not be written to this device's vault (${esc(S.failure)}). Nothing was lost on screen; nothing is stored. <span class="jd-actions" style="display:inline-flex;margin-left:8px"><button type="button" class="jd-btn" id="jd-retry">Try the vault again</button></span></div>` : ""}
    <article class="jd-record" aria-labelledby="jd-record-h" data-disposition="${esc(r.disposition)}" data-state="${esc(S.state)}">
      <div class="jd-record__head">
        <div>
          <div class="jd-record__eyebrow"><span class="stamp">${esc(eyeState)}</span><span>${esc(r.subject)}</span></div>
          <h2 class="jd-record__title">${esc(r.dispositionLabel)} by ${esc(r.actor.name).toLowerCase()} · ${fmtTime(r.confirmedAt)}</h2>
        </div>
        <div class="jd-record__id">${recorded ? `vault id #${S.recordId}<br>content hash SHA-256 ${shortHash(r.contentHash)}<br>computed in this browser · not a signature${signed ? `<br>packet signed · key ${shortHash(r.proof.fingerprint)}` : ""}` : `no vault id<br>not stored · no proof issued`}</div>
      </div>

      <section class="jd-q"><div><div class="jd-q__n">1</div><h3 class="jd-q__h">What was decided?</h3></div>
        <div class="jd-q__b"><p class="jd-q__lead">${decidedLead(r)}</p>
        <p>Decided by a person, not by the agent. The agent's completion on ${fmtTime(r.original.producer.producedAt)} was a <b>proposal</b>; this record is the judgment on it.</p></div></section>

      <section class="jd-q"><div><div class="jd-q__n">2</div><h3 class="jd-q__h">What did AI contribute?</h3></div>
        <div class="jd-q__b"><p>Everything in the card below, verbatim, produced by the <b>${esc(r.original.producer.name)}</b> (an agent) in a recorded fixture run. It is preserved exactly as produced${r.change ? `; the correction in §4 sits beside it and does not overwrite it` : ""}.</p>
        ${resultCard({ interactive: false, change: r.change, markChanged: true, badge: "AI-produced · preserved verbatim" })}</div></section>

      <section class="jd-q"><div><div class="jd-q__n">3</div><h3 class="jd-q__h">What evidence mattered?</h3></div>
        <div class="jd-q__b">
          <p>${seen.length ? `You opened <b>${seen.length} of ${r.evidence.length}</b> pieces before judging.` : `You opened <b>none</b> of the ${r.evidence.length} pieces before judging. The record says so.`}</p>
          <ul class="jd-evlist">${r.evidence.map(e => { const fx = evidenceById(e.id); return `<li><span class="mark ${e.inspected ? "is-seen" : ""}">${e.inspected ? "opened" : "not opened"}</span><span><b>${esc(e.title)}</b> · ${esc(fx?.bearing || "")}</span></li>`; }).join("")}</ul>
          ${unseen.length && r.disposition !== "reject" ? `<p style="margin-top:8px">Unopened evidence is still evidence; it just did not pass through your hands.</p>` : ""}
        </div></section>

      <section class="jd-q"><div><div class="jd-q__n">4</div><h3 class="jd-q__h">What did the human change?</h3></div>
        <div class="jd-q__b">${changeBlock}</div></section>

      <section class="jd-q"><div><div class="jd-q__n">5</div><h3 class="jd-q__h">Who authorized the judgment?</h3></div>
        <div class="jd-q__b">
          <div class="jd-facts">
            <div class="jd-fact"><span class="k">human actor</span><span class="v">${esc(r.actor.name)}</span><span class="v is-dim" style="font-size:.82rem">${esc(r.actor.identity)}</span></div>
            <div class="jd-fact"><span class="k">confirmed at</span><span class="v">${fmtTime(r.confirmedAt)}</span></div>
            <div class="jd-fact"><span class="k">recorded at</span><span class="v ${recorded ? "" : "is-dim"}">${recorded ? fmtTime(r.recordedAt) : failed ? "not recorded" : "writing…"}</span></div>
            <div class="jd-fact"><span class="k">agent actions in this record</span><span class="v">${r.agentActions.length}</span><span class="v is-dim" style="font-size:.82rem">${r.agentActions.map(a => `${esc(a.actor)} (agent) · ${esc(a.what)} · ${fmtTime(a.at)}`).join("<br>")}<br>agent actions happened before judgment and were not performed by you.</span></div>
          </div>
        </div></section>

      <section class="jd-q"><div><div class="jd-q__n">6</div><h3 class="jd-q__h">What is preserved, and what happens next?</h3></div>
        <div class="jd-q__b">
          <div class="jd-facts">
            <div class="jd-fact"><span class="k">stored</span><span class="v ${recorded ? "" : "is-dim"}">${recorded ? esc(r.preservation.store) : "not stored"}</span></div>
            <div class="jd-fact"><span class="k">original AI text</span><span class="v">preserved · ${origHash ? "SHA-256 " + shortHash(origHash) : "hash pending"}</span></div>
            <div class="jd-fact"><span class="k">signed</span><span class="v">${signed ? "yes · Ed25519 · demonstration key made in this browser" : recorded ? (r.proof ? "no · this browser could not sign" : "no · stored before this prototype signed records") : "no · nothing is signed until the record is stored"}</span><span class="v is-dim" style="font-size:.82rem">${signed ? "proves the packet is unchanged since this browser's key signed it; it does not identify a person or an organization" : "a content hash is not a signature"}</span></div>
            <div class="jd-fact"><span class="k">anchored · propagated</span><span class="v">no · no</span></div>
            <div class="jd-fact"><span class="k">rule activated</span><span class="v">no · corrections are evidence for a proposal, never a rule</span></div>
            <div class="jd-fact"><span class="k">comes back</span><span class="v">${r.disposition === "defer" ? `on Today · ${esc(fmtDue(r.defer.dueAt))}` : "on Today · as a re-entry card you can reopen"}</span></div>
          </div>
          <p style="margin-top:12px"><b>Still uncertain.</b></p>
          <ul class="jd-list">${r.remainingUncertainty.map(u => `<li>${esc(u)}</li>`).join("")}</ul>
          ${pattern}
        </div></section>

      ${recorded ? `<div class="jd-record__proof">${proofBlock(r)}</div>` : ""}
      <div class="jd-record__foot">
        ${recorded ? `<a class="jd-btn jd-btn--primary" id="jd-to-today" href="10-today.html?record=${S.recordId}">Continue to Today →</a>` : `<button type="button" class="jd-btn jd-btn--primary" disabled title="Nothing to reopen until the record is stored">Continue to Today →</button>`}
        ${S.reopened ? `<a class="jd-btn" href="10-today.html">Back to Today</a>` : ""}
        <a class="jd-btn" href="13-judgment.html">Judge it again · fresh</a>
        <span class="jd-hint">${recorded ? `Reopen later with <span class="jd-kbd">?record=${S.recordId}</span>` : ""}</span>
      </div>
    </article>
    <div class="jd-foot">What the agent said and what you said are two voices in one record. Neither overwrites the other, and the person who was not in the room can tell them apart.</div>
  </div>`;
  const retry = $("#jd-retry"); if (retry) retry.addEventListener("click", async () => { S.failure = null; renderRecord(); await persist(); });
  const dl = $("#jd-proof-dl"); if (dl) dl.addEventListener("click", () => downloadProof().catch(err => { console.warn("[judgment] proof bundle failed", err); toast(`Proof bundle could not be built · ${esc(err?.message || err)}`); }));
  applyFocus();
}

function renderNotFound(id) {
  main.innerHTML = `<div class="jd-wrap jd-enter">
    <div class="jd-eyebrow">Decision record · not found</div>
    <h1 class="jd-title" tabindex="-1" id="jd-record-h">No record #${esc(id)} in this device's vault.</h1>
    <div class="jd-notice jd-notice--quiet" style="margin-bottom:1.2rem"><span class="k">why this can happen</span>Records live in this browser's IndexedDB only. A different browser, a cleared site store, or a link from someone else's device will not find it. ${vaultAvailable() ? "" : "This browser context has no IndexedDB at all."}</div>
    <div class="jd-actions"><a class="jd-btn jd-btn--primary" href="13-judgment.html">Judge the AI result afresh →</a><a class="jd-btn" href="10-today.html">Back to Today</a></div>
  </div>`;
  applyFocus();
}

/* ─── boot ──────────────────────────────────────────────────────────── */
async function boot() {
  S.originalHash = await sha256Hex({
    producer: { ...FIXTURE.producer }, headline: FIXTURE.headline,
    assertions: FIXTURE.assertions.map(a => ({ id: a.id, text: a.text, support: a.support })),
    caseId: FIXTURE.caseId, findingId: FIXTURE.findingId,
  });
  const want = new URLSearchParams(location.search).get("record");
  if (want) {
    const hit = await loadJudgment(want).catch(() => null);
    if (hit) {
      S.view = "record"; S.reopened = true; S.record = hit.record; S.recordId = hit.id; S.recordTs = hit.ts; S.state = STATES.RECORDED;
      if (hit.record.change) S.pattern = await correctionPattern({ tag: hit.record.change.tag, lane: hit.record.lane });
      renderRecord();
    } else {
      S.view = "notfound"; renderNotFound(want);
    }
  } else {
    renderJudge();
  }
  main.setAttribute("aria-busy", "false");
  requestAnimationFrame(() => document.body.classList.add("ready"));
}

/* keyboard · esc steps back inside the panel; never leaves the page */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || S.view !== "judge") return;
  if (document.querySelector(".sn-palette.is-open")) return;
  if (S.phase === "confirm") { S.phase = "form"; S.focus = "jd-panel-h"; renderJudge(); }
  else if (S.phase === "form") { S.phase = "choose"; S.problems = []; S.focus = "jd-panel-h"; renderJudge(); }
});

/* ↺ restart (lib/demo-restart.js) · a fresh proposal, the vault untouched */
window.__demoReset = () => { location.href = location.pathname; };

boot().catch(err => {
  console.error("[judgment] boot failed", err);
  main.innerHTML = `<div class="jd-wrap"><div class="jd-notice"><span class="k">could not start</span>${esc(err?.message || err)}</div></div>`;
  document.body.classList.add("ready");
});
</script>
